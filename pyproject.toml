[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudsense"
version = "0.1.0"
description = "Relational Fraud Detection and Conversational Compliance Prototype"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "FraudSense Research Team" }
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
